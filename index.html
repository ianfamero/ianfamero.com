<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ian Famero | Web Developer</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <div id="loader" aria-hidden="true">
        <div class="loader-inner">
            <span class="loader-name">Ian Famero</span>
            <div class="loader-bar">
                <div class="loader-fill"></div>
            </div>
        </div>
    </div>

    <main>
        <section class="container hero">
            <div>
                <h1>
                    Ian Famero
                    <span>Web Developer</span>
                </h1>

                <p>
                    I build high-performance websites and web applications that are reliable, scalable, and built to last.
                </p>

                <div class="hero-buttons">
                    <a href="#contact" class="btn-secondary">Contact</a>
                </div>

                <div class="code-block">
                    <p>const developer = {</p>
                    <p class="indent">name: "Ian",</p>
                    <p class="indent">focus: "Web Development",</p>
                    <p class="indent">location: "PH"</p>
                    <p>};</p>
                </div>
            </div>

            <div class="hero-image-wrap">
                <div class="glow"></div>
                <div class="image-card">
                    <img src="images/ian-famero-anime.png" alt="Portrait" />
                </div>
            </div>
        </section>

        <section id="contact">
            <div class="container">
                <div class="contact-box reveal">
                    <h2>Let's build something different.</h2>
                    <a href="mailto:contact@ianfamero.com" class="btn-primary">Email Me</a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js" defer></script>
</body>

</html>
